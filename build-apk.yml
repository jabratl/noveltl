name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install
      - name: Prepare web files (bundle JSZip and XLSX so the app works offline)
        run: |
          rm -rf www && mkdir www && cp index.html manifest.json sw.js icon-192.png icon-512.png icon-maskable-512.png www/
          cp node_modules/jszip/dist/jszip.min.js www/
          cp node_modules/xlsx/dist/xlsx.full.min.js www/
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#jszip.min.js#; s#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#' www/index.html
          grep -c "cdnjs" www/index.html || true
      - name: Create Android project
        run: npx cap add android
      - name: Use our app icon
        run: |
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon-192.png $R/mipmap-$d/ic_launcher.png
            cp icon-192.png $R/mipmap-$d/ic_launcher_round.png
            cp icon-192.png $R/mipmap-$d/ic_launcher_foreground.png
          done
      - name: Sync web files into the app
        run: npx cap sync android
      - name: Use the fixed signing key (so updates install over the old app)
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NovelTranslator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovelTranslator-apk
          path: NovelTranslator.apk
      - name: Publish as a release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Novel Translator build ${{ github.run_number }}
          files: NovelTranslator.apk
